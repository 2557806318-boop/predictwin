<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Paper decision lifecycle and timing boundaries</title><desc id="desc">Feature, decision, book, quote and paper commit are timed. Validation failure skips the opportunity. Cumulative milestones must not be summed.</desc>
<rect width="1200" height="500" rx="20" fill="#0b1324"/><g font-family="Arial,sans-serif"><text x="48" y="60" fill="#edf4ff" font-size="30" font-weight="bold">One candidate. One actual-amount quote. Explicit outcomes.</text><text x="48" y="100" fill="#a9bad0" font-size="18">Illustrative flow only — no latency or profitability claims.</text>
<path d="M104 205H1090" stroke="#64dfbd" stroke-width="4"/>
<g fill="#64dfbd"><circle cx="104" cy="205" r="12"/><circle cx="302" cy="205" r="12"/><circle cx="500" cy="205" r="12"/><circle cx="698" cy="205" r="12"/><circle cx="896" cy="205" r="12"/><circle cx="1090" cy="205" r="12"/></g>
<g fill="#edf4ff" font-size="18" text-anchor="middle"><text x="104" y="170">Tick</text><text x="302" y="170">Features</text><text x="500" y="170">Candidate</text><text x="698" y="170">Dual books</text><text x="896" y="170">Exact quote</text><text x="1090" y="170">Paper fill</text></g>
<g fill="#a9bad0" font-size="15" text-anchor="middle"><text x="200" y="247">Feature time</text><text x="400" y="247">Inference</text><text x="600" y="247">Book RTT</text><text x="800" y="247">Quote RTT</text><text x="1000" y="247">DB transaction</text></g>
<path d="M500 220V295H1090" stroke="#efc184" stroke-width="2" fill="none"/><text x="515" y="324" fill="#efc184" font-size="17">SKIP: stale data / book mismatch / no edge / expired quote / insufficient paper cash</text>
<rect x="48" y="363" width="1104" height="90" fill="#152139" rx="12"/><text x="68" y="397" fill="#edf4ff" font-size="18">Total path is measured directly, not estimated by summing percentiles.</text><text x="68" y="428" fill="#a9bad0" font-size="17">Paper fill ≠ venue acceptance ≠ FOK execution ≠ blockchain confirmation.</text></g></svg>
