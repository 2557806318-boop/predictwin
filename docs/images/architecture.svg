<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Prediction market research framework architecture</title><desc id="desc">Synthetic or public inputs enter bounded feature windows. A user supplied strategy creates a candidate, validated against books and exact amount quote, then an atomic paper ledger. Audit and latency flow into a read-only console. Live execution is excluded.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64dfbd"/></marker></defs>
<rect width="1200" height="660" rx="22" fill="#0b1324"/>
<g font-family="Arial, sans-serif"><text x="48" y="57" fill="#64dfbd" font-size="14" letter-spacing="3">PAPER ONLY · STRATEGY PLUG-IN · AUDITABLE</text><text x="48" y="105" fill="#edf4ff" font-size="34" font-weight="bold">From market events to reproducible decisions</text><text x="48" y="143" fill="#a9bad0" font-size="18">Public framework extraction. No private alpha, account data or production history.</text>
<g fill="#152139" stroke="#304865" stroke-width="2"><rect x="48" y="195" width="230" height="122" rx="12"/><rect x="336" y="195" width="230" height="122" rx="12"/><rect x="624" y="195" width="230" height="122" rx="12"/><rect x="912" y="195" width="240" height="122" rx="12"/><rect x="48" y="398" width="330" height="126" rx="12"/><rect x="435" y="398" width="330" height="126" rx="12"/><rect x="822" y="398" width="330" height="126" rx="12"/></g>
<g fill="#edf4ff" font-size="21" font-weight="bold"><text x="68" y="233">01 / Market data</text><text x="356" y="233">02 / Your strategy</text><text x="644" y="233">03 / Quote checks</text><text x="932" y="233">04 / Paper ledger</text><text x="68" y="438">Checkpoint audit</text><text x="455" y="438">Persistent telemetry</text><text x="842" y="438">Read-only console</text></g>
<g fill="#a9bad0" font-size="16"><text x="68" y="267">Ordering · bounded windows</text><text x="68" y="292">3 / 10 / 30 / 60 seconds</text><text x="356" y="267">Intentionally unimplemented</text><text x="356" y="292">Default decision = SKIP</text><text x="644" y="267">Dual books · exact amount</text><text x="644" y="292">Expiry · fee-inclusive cost</text><text x="932" y="267">Atomic cash / settlement</text><text x="932" y="292">Fixed-point accounting</text><text x="68" y="473">Separate from entry decisions</text><text x="68" y="499">Replay without future observations</text><text x="455" y="473">SQLite WAL · p50 / p95 / p99</text><text x="455" y="499">Measured scope + sample counts</text><text x="842" y="473">Loopback HTTP · JSON API</text><text x="842" y="499">No order or credential endpoint</text></g>
<g stroke="#64dfbd" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M278 256H326"/><path d="M566 256H614"/><path d="M854 256H902"/><path d="M163 317V388"/><path d="M739 317V350H600V388"/><path d="M378 461H425"/><path d="M765 461H812"/><path d="M1032 317V388"/></g>
<rect x="48" y="566" width="1104" height="50" rx="10" fill="#322b23"/><text x="68" y="597" fill="#efc184" font-size="17">NOT INCLUDED: live trading · signing keys · Telegram control tokens · historical P&amp;L · trained model artifacts</text></g></svg>
